[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "churchilleduce", email = "churchilleduce@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.30.0",
    "openai>=3.36.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
